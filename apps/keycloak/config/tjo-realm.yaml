realm: tjo
enabled: true
displayName: TJO
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
resetPasswordAllowed: true
editUsernameAllowed: false

roles:
  realm:
    - name: user
      description: Standard user role
    - name: tjo-user
      description: TJO standard user
    - name: tjo-admin
      description: TJO administrator

clients:
  - clientId: tjo-app
    name: TJO Application
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    redirectUris:
      - "http://localhost:3000/*"
    webOrigins:
      - "http://localhost:3000"
    defaultClientScopes:
      - profile
      - email

groups:
  - name: tjo-users
    path: /tjo-users
    realmRoles:
      - tjo-user

  - name: tjo-admins
    path: /tjo-admins
    realmRoles:
      - tjo-admin

users:
  - username: tjo-test
    enabled: true
    groups:
      - tjo-users
    requiredActions:
      - UPDATE_PASSWORD

